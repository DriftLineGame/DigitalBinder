<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Disc Trail Cam</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1c2128; --line:#2a3038;
    --accent:#ff7a3d; --accent2:#3ddaff; --text:#eef2f5; --sub:#8a94a1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; height:100%; width:100%;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  #topbar{display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px calc(10px + env(safe-area-inset-top,0px)); background:var(--panel);
    padding-top:10px; z-index:5;}
  #topbar h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.3px;}
  #topbar .sub{font-size:11px; color:var(--sub);}
  .iconbtn{background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:8px 10px; font-size:13px; display:flex; align-items:center; gap:6px;}
  #stageWrap{position:relative; flex:1; min-height:0; background:#000; display:flex;
    align-items:center; justify-content:center; overflow:hidden;}
  #video{position:absolute; opacity:0; pointer-events:none;}
  #stage{max-width:100%; max-height:100%; touch-action:none; display:block;}
  #tapHint{position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.15); padding:7px 14px;
    border-radius:999px; font-size:13px; pointer-events:none; transition:opacity .25s;}
  #lostBanner{position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(200,60,40,.85); padding:7px 14px; border-radius:999px; font-size:13px;
    pointer-events:none; opacity:0; transition:opacity .25s;}
  #lostBanner.show{opacity:1;}
  #camStatus{position:absolute; top:14px; right:14px; background:rgba(0,0,0,.5);
    padding:5px 9px; border-radius:8px; font-size:11px; color:var(--sub);}
  #recDot{width:9px; height:9px; border-radius:50%; background:#ff3b3b; display:none;
    animation:pulse 1s infinite;}
  #recDot.on{display:inline-block;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
  #bottombar{display:flex; align-items:center; justify-content:space-around; gap:8px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--panel);
    z-index:5;}
  .bigbtn{flex:1; max-width:200px; padding:13px 10px; border-radius:14px; border:none;
    font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;}
  #recordBtn{background:var(--accent); color:#1a0d05;}
  #recordBtn.recording{background:#c8322a; color:#fff;}
  #resetBtn{background:var(--panel2); color:var(--text); border:1px solid var(--line);}
  #panel{position:fixed; left:0; right:0; bottom:0; max-height:78vh; background:var(--panel);
    border-radius:18px 18px 0 0; transform:translateY(100%); transition:transform .28s ease;
    z-index:20; box-shadow:0 -8px 30px rgba(0,0,0,.5); display:flex; flex-direction:column;}
  #panel.open{transform:translateY(0);}
  #panelHead{display:flex; justify-content:space-between; align-items:center; padding:14px 16px 6px;}
  #panelHead h2{font-size:15px; margin:0;}
  #panelBody{overflow-y:auto; padding:4px 16px 20px;}
  .grp{margin-bottom:18px;}
  .grp h3{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--sub);
    margin:0 0 8px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .row label{font-size:13.5px; flex:1;}
  select, input[type=range]{accent-color:var(--accent);}
  select{background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 8px; font-size:13px;}
  input[type=range]{width:120px;}
  input[type=color]{width:44px; height:30px; border:none; border-radius:8px; background:none; padding:0;}
  .toggle{position:relative; width:46px; height:26px; background:var(--panel2);
    border:1px solid var(--line); border-radius:999px; flex-shrink:0;}
  .toggle input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
  .toggle .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--sub); transition:all .18s;}
  .toggle input:checked + .knob{background:var(--accent); left:22px;}
  .closeBtn{background:none; border:none; color:var(--sub); font-size:20px; line-height:1;}
  #overlayClose{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:19; opacity:0;
    pointer-events:none; transition:opacity .25s;}
  #overlayClose.show{opacity:1; pointer-events:auto;}
  #playback{position:fixed; inset:0; background:#000; z-index:30; display:none;
    flex-direction:column;}
  #playback video{flex:1; width:100%; object-fit:contain; background:#000;}
  #playbackBar{display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--panel);}
  #playbackBar a, #playbackBar button{flex:1; text-align:center; padding:13px; border-radius:12px;
    text-decoration:none; font-weight:600; font-size:14px; border:none;}
  #dlBtn{background:var(--accent); color:#1a0d05;}
  #shareBtn{background:var(--panel2); color:var(--text); border:1px solid var(--line);}
  #discardBtn{background:var(--panel2); color:#ff8a80; border:1px solid var(--line);}
  small.hint{color:var(--sub); font-size:11.5px; display:block; margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div>
      <h1>Disc Trail Cam</h1>
      <div class="sub" id="statusLine">Starting camera…</div>
    </div>
    <button class="iconbtn" id="settingsBtn">⚙ Settings</button>
  </div>

  <div id="stageWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="stage"></canvas>
    <div id="tapHint">Tap the disc to start tracking</div>
    <div id="lostBanner">Trail ended — tracking lost</div>
    <div id="camStatus"><span id="recDot"></span> <span id="resLabel">–</span></div>
  </div>

  <div id="bottombar">
    <button class="bigbtn" id="resetBtn">↺ Reset Trail</button>
    <button class="bigbtn" id="recordBtn">● Record</button>
  </div>
</div>

<div id="overlayClose"></div>
<div id="panel">
  <div id="panelHead">
    <h2>Camera &amp; Trail Settings</h2>
    <button class="closeBtn" id="panelCloseBtn">✕</button>
  </div>
  <div id="panelBody">
    <div class="grp">
      <h3>Camera</h3>
      <div class="row"><label>Lens</label>
        <select id="facingSelect">
          <option value="environment">Back</option>
          <option value="user">Front</option>
        </select>
      </div>
      <div class="row"><label>Resolution</label>
        <select id="resSelect">
          <option value="1280x720">720p</option>
          <option value="1920x1080" selected>1080p</option>
          <option value="3840x2160">4K (if supported)</option>
          <option value="640x480">480p (fastest tracking)</option>
        </select>
      </div>
      <div class="row"><label>Frame rate</label>
        <select id="fpsSelect">
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps (smoother tracking)</option>
        </select>
      </div>
      <div class="row" id="zoomRow" style="display:none;"><label>Zoom</label>
        <input type="range" id="zoomSlider" min="1" max="8" step="0.1" value="1">
      </div>
      <div class="row" id="torchRow" style="display:none;"><label>Flashlight</label>
        <div class="toggle"><input type="checkbox" id="torchToggle"><div class="knob"></div></div>
      </div>
    </div>

    <div class="grp">
      <h3>Trail</h3>
      <div class="row"><label>Match disc color</label>
        <div class="toggle"><input type="checkbox" id="matchColorToggle"><div class="knob"></div></div>
      </div>
      <div class="row"><label>Line color</label>
        <input type="color" id="colorPicker" value="#3ddaff">
      </div>
      <div class="row"><label>Line thickness</label>
        <input type="range" id="thicknessSlider" min="4" max="40" step="1" value="16">
      </div>
      <div class="row"><label>Trail opacity</label>
        <input type="range" id="opacitySlider" min="0.15" max="1" step="0.05" value="0.65">
      </div>
      <div class="row"><label>Tracking sensitivity</label>
        <input type="range" id="sensSlider" min="1" max="100" step="1" value="60">
      </div>
      <div class="row"><label>Fade older trail</label>
        <div class="toggle"><input type="checkbox" id="fadeToggle"><div class="knob"></div></div>
      </div>
      <small class="hint">If tracking jumps to your hand/arm, raise sensitivity. If it misses a light-colored disc against a bright sky, lower it.</small>
    </div>
  </div>
</div>

<div id="playback">
  <video id="playbackVideo" playsinline controls></video>
  <div id="playbackBar">
    <a id="dlBtn" href="#" download="disc-trail.webm">Save file</a>
    <button id="shareBtn">Share</button>
    <button id="discardBtn">Discard</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- DOM ----------
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d', {willReadFrequently:false});
  const tapHint = document.getElementById('tapHint');
  const lostBanner = document.getElementById('lostBanner');
  const statusLine = document.getElementById('statusLine');
  const resLabel = document.getElementById('resLabel');
  const recDot = document.getElementById('recDot');

  const panel = document.getElementById('panel');
  const overlayClose = document.getElementById('overlayClose');
  const settingsBtn = document.getElementById('settingsBtn');
  const panelCloseBtn = document.getElementById('panelCloseBtn');

  const facingSelect = document.getElementById('facingSelect');
  const resSelect = document.getElementById('resSelect');
  const fpsSelect = document.getElementById('fpsSelect');
  const zoomRow = document.getElementById('zoomRow');
  const zoomSlider = document.getElementById('zoomSlider');
  const torchRow = document.getElementById('torchRow');
  const torchToggle = document.getElementById('torchToggle');

  const matchColorToggle = document.getElementById('matchColorToggle');
  const colorPicker = document.getElementById('colorPicker');
  const thicknessSlider = document.getElementById('thicknessSlider');
  const opacitySlider = document.getElementById('opacitySlider');
  const sensSlider = document.getElementById('sensSlider');
  const fadeToggle = document.getElementById('fadeToggle');

  const resetBtn = document.getElementById('resetBtn');
  const recordBtn = document.getElementById('recordBtn');

  const playback = document.getElementById('playback');
  const playbackVideo = document.getElementById('playbackVideo');
  const dlBtn = document.getElementById('dlBtn');
  const shareBtn = document.getElementById('shareBtn');
  const discardBtn = document.getElementById('discardBtn');

  // ---------- State ----------
  let currentStream = null;
  let videoTrack = null;
  let trackW = 208, trackH = 117;         // low-res analysis buffer size
  let grayPrev = null, grayCurr = null;
  let smallCanvas = document.createElement('canvas');
  let smallCtx = smallCanvas.getContext('2d', {willReadFrequently:true});

  let tracking = false;
  let lostFrames = 0;
  const LOST_LIMIT = 20;                  // consecutive true misses (after coasting) before we call it lost
  let lastTrackPt = null;                 // {x,y} in track-res coords — actual or coasted
  let trackVel = {x:0, y:0};              // estimated per-frame velocity, track-res coords
  let smoothPt = null;                    // {x,y} in full-res coords
  let points = [];                        // [{x,y,t,color?}] full-res, for drawing
  let currentColor = '#3ddaff';
  let colorLocked = false;

  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  // ---------- Camera setup ----------
  async function startCamera(){
    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
    }
    const [w,h] = resSelect.value.split('x').map(Number);
    const fps = Number(fpsSelect.value);
    const constraints = {
      audio:false,
      video:{
        facingMode: {ideal: facingSelect.value},
        width:{ideal:w}, height:{ideal:h},
        frameRate:{ideal:fps}
      }
    };
    try{
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    }catch(err){
      statusLine.textContent = 'Camera error: '+err.message;
      return;
    }
    video.srcObject = currentStream;
    await video.play();
    videoTrack = currentStream.getVideoTracks()[0];

    await new Promise(res=>{
      if(video.readyState >= 2) return res();
      video.onloadedmetadata = ()=>res();
    });

    stage.width = video.videoWidth;
    stage.height = video.videoHeight;
    resLabel.textContent = video.videoWidth+'×'+video.videoHeight;
    statusLine.textContent = 'Tap the disc to lock tracking';

    trackH = Math.max(60, Math.round(trackW * (video.videoHeight/video.videoWidth)));
    smallCanvas.width = trackW; smallCanvas.height = trackH;
    grayPrev = new Uint8ClampedArray(trackW*trackH);
    grayCurr = new Uint8ClampedArray(trackW*trackH);

    setupZoomTorch();
    requestAnimationFrame(loop);
  }

  function setupZoomTorch(){
    zoomRow.style.display = 'none';
    torchRow.style.display = 'none';
    if(!videoTrack || !videoTrack.getCapabilities) return;
    let caps;
    try{ caps = videoTrack.getCapabilities(); }catch(e){ return; }
    if(caps.zoom){
      zoomRow.style.display = 'flex';
      zoomSlider.min = caps.zoom.min; zoomSlider.max = caps.zoom.max;
      zoomSlider.step = caps.zoom.step || 0.1;
      zoomSlider.value = caps.zoom.min;
    }
    if(caps.torch){
      torchRow.style.display = 'flex';
    }
  }

  zoomSlider.addEventListener('input', ()=>{
    if(videoTrack) videoTrack.applyConstraints({advanced:[{zoom:Number(zoomSlider.value)}]}).catch(()=>{});
  });
  torchToggle.addEventListener('change', ()=>{
    if(videoTrack) videoTrack.applyConstraints({advanced:[{torch:torchToggle.checked}]}).catch(()=>{
      torchToggle.checked = false;
    });
  });
  [facingSelect, resSelect, fpsSelect].forEach(el=>{
    el.addEventListener('change', ()=>{ resetTrailState(); startCamera(); });
  });

  // ---------- Panel open/close ----------
  function openPanel(){ panel.classList.add('open'); overlayClose.classList.add('show'); }
  function closePanel(){ panel.classList.remove('open'); overlayClose.classList.remove('show'); }
  settingsBtn.addEventListener('click', openPanel);
  panelCloseBtn.addEventListener('click', closePanel);
  overlayClose.addEventListener('click', closePanel);

  // ---------- Tap to lock tracking ----------
  stage.addEventListener('pointerdown', (e)=>{
    const rect = stage.getBoundingClientRect();
    const sx = (e.clientX - rect.left) / rect.width * stage.width;
    const sy = (e.clientY - rect.top) / rect.height * stage.height;
    lockTrackingAt(sx, sy);
  });

  function lockTrackingAt(fullX, fullY){
    const scaleX = trackW/stage.width, scaleY = trackH/stage.height;
    lastTrackPt = {x: fullX*scaleX, y: fullY*scaleY};
    trackVel = {x:0, y:0};
    smoothPt = {x: fullX, y: fullY};
    points = [{x:fullX, y:fullY, t:performance.now()}];
    tracking = true;
    lostFrames = 0;
    colorLocked = false;
    lostBanner.classList.remove('show');
    tapHint.style.opacity = '0';
    statusLine.textContent = 'Tracking…';
    sampleColorAt(Math.round(lastTrackPt.x), Math.round(lastTrackPt.y));
  }

  function resetTrailState(){
    tracking = false;
    points = [];
    lastTrackPt = null; smoothPt = null;
    trackVel = {x:0, y:0};
    lostFrames = 0; colorLocked = false;
    lostBanner.classList.remove('show');
    tapHint.style.opacity = '1';
    statusLine.textContent = 'Tap the disc to lock tracking';
  }
  resetBtn.addEventListener('click', resetTrailState);

  // ---------- Color sampling from the low-res color buffer ----------
  function sampleColorAt(cx, cy){
    if(matchColorToggle.checked === false) return;
    const data = smallCtx.getImageData(0,0,trackW,trackH).data;
    let r=0,g=0,b=0,n=0;
    for(let dy=-3; dy<=3; dy++){
      for(let dx=-3; dx<=3; dx++){
        const x = cx+dx, y = cy+dy;
        if(x<0||y<0||x>=trackW||y>=trackH) continue;
        const i = (y*trackW+x)*4;
        r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
      }
    }
    if(n===0) return;
    r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
    currentColor = 'rgb('+r+','+g+','+b+')';
    colorLocked = true;
  }

  // ---------- Connected components on motion mask ----------
  // mask: Uint8Array length trackW*trackH, 1 = motion pixel
  function findBlobs(mask){
    const W=trackW, H=trackH;
    const visited = new Uint8Array(W*H);
    const blobs = [];
    const stack = new Int32Array(W*H);
    for(let idx=0; idx<W*H; idx++){
      if(!mask[idx] || visited[idx]) continue;
      let sp=0; stack[sp++]=idx; visited[idx]=1;
      let sumX=0, sumY=0, count=0;
      let minX=W, maxX=0, minY=H, maxY=0;
      while(sp>0){
        const cur = stack[--sp];
        const cx = cur % W, cy = (cur/W)|0;
        sumX+=cx; sumY+=cy; count++;
        if(cx<minX)minX=cx; if(cx>maxX)maxX=cx;
        if(cy<minY)minY=cy; if(cy>maxY)maxY=cy;
        // 4-neighbors
        if(cx>0){ const n=cur-1; if(mask[n] && !visited[n]){visited[n]=1; stack[sp++]=n;} }
        if(cx<W-1){ const n=cur+1; if(mask[n] && !visited[n]){visited[n]=1; stack[sp++]=n;} }
        if(cy>0){ const n=cur-W; if(mask[n] && !visited[n]){visited[n]=1; stack[sp++]=n;} }
        if(cy<H-1){ const n=cur+W; if(mask[n] && !visited[n]){visited[n]=1; stack[sp++]=n;} }
      }
      blobs.push({
        x:sumX/count, y:sumY/count, area:count,
        w:maxX-minX+1, h:maxY-minY+1
      });
    }
    return mergeCloseBlobs(blobs);
  }

  // A spinning/glinting disc often fractures into 2-3 separate blobs one frame
  // to the next. Merge blobs that are close together into a single weighted blob
  // so the centroid stays stable instead of jumping between fragments.
  function mergeCloseBlobs(blobs){
    const merged = [];
    const used = new Uint8Array(blobs.length);
    const mergeDist = trackW * 0.06;
    for(let i=0; i<blobs.length; i++){
      if(used[i]) continue;
      let b = {...blobs[i]};
      used[i] = 1;
      for(let j=i+1; j<blobs.length; j++){
        if(used[j]) continue;
        const dx = blobs[j].x - b.x, dy = blobs[j].y - b.y;
        if(Math.sqrt(dx*dx+dy*dy) < mergeDist){
          const totalArea = b.area + blobs[j].area;
          b = {
            x: (b.x*b.area + blobs[j].x*blobs[j].area) / totalArea,
            y: (b.y*b.area + blobs[j].y*blobs[j].area) / totalArea,
            area: totalArea,
            w: Math.max(b.w, blobs[j].w),
            h: Math.max(b.h, blobs[j].h)
          };
          used[j] = 1;
        }
      }
      merged.push(b);
    }
    return merged;
  }

  // ---------- Main loop ----------
  let lastFrameTime = performance.now();
  function loop(){
    if(video.readyState >= 2 && video.videoWidth>0){
      // draw the visible/recorded frame
      ctx.drawImage(video, 0, 0, stage.width, stage.height);

      // draw low-res copy for analysis + color sampling
      smallCtx.drawImage(video, 0, 0, trackW, trackH);
      const imgData = smallCtx.getImageData(0,0,trackW,trackH);
      const d = imgData.data;
      for(let p=0, i=0; i<d.length; i+=4, p++){
        grayCurr[p] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
      }

      if(tracking && grayPrev){
        const threshold = 6 + (100-Number(sensSlider.value))*0.55; // lower slider->more sensitive->lower threshold
        const mask = new Uint8Array(trackW*trackH);
        let changed = 0;
        for(let p=0; p<mask.length; p++){
          if(Math.abs(grayCurr[p]-grayPrev[p]) > threshold){ mask[p]=1; changed++; }
        }
        const totalPx = trackW*trackH;

        // Predict where the disc should be this frame from its recent velocity,
        // and search around that predicted point rather than the last fixed spot —
        // this is what keeps a fast throw from "glitching" off between frames.
        const predicted = {
          x: Math.min(trackW-1, Math.max(0, lastTrackPt.x + trackVel.x)),
          y: Math.min(trackH-1, Math.max(0, lastTrackPt.y + trackVel.y))
        };
        const speed = Math.sqrt(trackVel.x*trackVel.x + trackVel.y*trackVel.y);
        const maxJump = Math.min(trackW*0.5, 20 + speed*2.5);

        let matchedBlob = null;
        if(changed < totalPx*0.5){ // reject whole-frame lighting shifts / big shake
          const blobs = findBlobs(mask);
          const minArea = Math.max(4, Math.round(totalPx*0.0007)), maxArea = totalPx*0.18;
          let bestDist = Infinity;
          for(const b of blobs){
            if(b.area < minArea || b.area > maxArea) continue;
            const aspect = b.w / Math.max(1,b.h);
            if(aspect < 0.3 || aspect > 3.2) continue; // reject long thin arm-like blobs
            const dx = b.x - predicted.x, dy = b.y - predicted.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if(dist > maxJump) continue;
            if(dist < bestDist){ bestDist = dist; matchedBlob = b; }
          }
        }

        if(matchedBlob){
          const newVel = {x: matchedBlob.x - lastTrackPt.x, y: matchedBlob.y - lastTrackPt.y};
          trackVel = {x: trackVel.x*0.4 + newVel.x*0.6, y: trackVel.y*0.4 + newVel.y*0.6};
          lastTrackPt = {x:matchedBlob.x, y:matchedBlob.y};
          lostFrames = 0;
          const scaleX = stage.width/trackW, scaleY = stage.height/trackH;
          const fx = matchedBlob.x*scaleX, fy = matchedBlob.y*scaleY;
          const alpha = 0.5; // exponential smoothing factor
          smoothPt = {
            x: smoothPt.x + (fx-smoothPt.x)*alpha,
            y: smoothPt.y + (fy-smoothPt.y)*alpha
          };
          points.push({x:smoothPt.x, y:smoothPt.y, t:performance.now()});
          if(!colorLocked) sampleColorAt(Math.round(matchedBlob.x), Math.round(matchedBlob.y));
        } else {
          // No confirmed detection this frame: coast forward on the predicted
          // position (don't add a trail point, just keep the search gate on-track)
          // and decay velocity a little so we don't run away if it's really gone.
          lastTrackPt = predicted;
          trackVel = {x: trackVel.x*0.85, y: trackVel.y*0.85};
          lostFrames++;
          if(lostFrames > LOST_LIMIT){
            tracking = false;
            lostBanner.classList.add('show');
            statusLine.textContent = 'Trail ended — tap to start a new one';
          }
        }
      }

      // swap gray buffers
      const tmp = grayPrev; grayPrev = grayCurr; grayCurr = tmp || new Uint8ClampedArray(trackW*trackH);

      drawTrail();
    }
    requestAnimationFrame(loop);
  }

  // Smooth freehand-style line through recorded points (midpoint quadratic technique)
  function drawTrail(){
    if(points.length < 2) return;
    const thickness = Number(thicknessSlider.value);
    const baseAlpha = Number(opacitySlider.value);
    const useMatch = matchColorToggle.checked;
    const baseColor = useMatch ? currentColor : colorPicker.value;
    const fade = fadeToggle.checked;
    const now = performance.now();
    const FADE_MS = 3500;

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = baseColor;
    ctx.lineWidth = thickness;

    if(!fade){
      // One single path for the whole trail at a constant semi-transparent alpha.
      // Stroking one continuous path (instead of many overlapping short segments)
      // avoids the darker/patchy look you get where segments double up on bends.
      ctx.globalAlpha = baseAlpha;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for(let i=1; i<points.length-1; i++){
        const p1 = points[i], p2 = points[i+1];
        const mid = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
        ctx.quadraticCurveTo(p1.x, p1.y, mid.x, mid.y);
      }
      const last = points[points.length-1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }

    // Fade mode needs per-segment alpha, so segments are stroked individually.
    for(let i=1; i<points.length-1; i++){
      const p0 = points[i-1], p1 = points[i], p2 = points[i+1];
      const midA = {x:(p0.x+p1.x)/2, y:(p0.y+p1.y)/2};
      const midB = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
      const age = now - p1.t;
      const alpha = Math.max(0.06, baseAlpha * (1 - age/FADE_MS));
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(midA.x, midA.y);
      ctx.quadraticCurveTo(p1.x, p1.y, midB.x, midB.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // drop points that are fully faded so the array doesn't grow forever
    while(points.length && (now - points[0].t) > FADE_MS + 500){
      points.shift();
    }
  }

  // ---------- Recording ----------
  function pickMimeType(){
    const options = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4'
    ];
    for(const o of options){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(o)) return o;
    }
    return '';
  }

  recordBtn.addEventListener('click', ()=>{
    if(!isRecording) startRecording(); else stopRecording();
  });

  function startRecording(){
    const fps = Number(fpsSelect.value);
    const canvasStream = stage.captureStream(fps);
    const mimeType = pickMimeType();
    try{
      mediaRecorder = mimeType ? new MediaRecorder(canvasStream, {mimeType}) : new MediaRecorder(canvasStream);
    }catch(e){
      alert('Recording is not supported in this browser.');
      return;
    }
    recordedChunks = [];
    mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStopped;
    mediaRecorder.start(200);
    isRecording = true;
    recordBtn.textContent = '■ Stop';
    recordBtn.classList.add('recording');
    recDot.classList.add('on');
  }

  function stopRecording(){
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '● Record';
    recordBtn.classList.remove('recording');
    recDot.classList.remove('on');
  }

  function onRecordingStopped(){
    const type = mediaRecorder.mimeType || 'video/webm';
    const blob = new Blob(recordedChunks, {type});
    const url = URL.createObjectURL(blob);
    playbackVideo.src = url;
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    dlBtn.href = url;
    dlBtn.download = 'disc-trail.'+ext;
    playback.style.display = 'flex';

    shareBtn.onclick = async ()=>{
      try{
        const file = new File([blob], 'disc-trail.'+ext, {type});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:'Disc Trail'});
        } else {
          alert('Direct share is not supported here — use Save file instead.');
        }
      }catch(e){ /* user cancelled share, ignore */ }
    };
  }

  discardBtn.addEventListener('click', ()=>{
    playback.style.display = 'none';
    playbackVideo.pause();
    playbackVideo.removeAttribute('src');
    playbackVideo.load();
  });

  // ---------- Boot ----------
  matchColorToggle.addEventListener('change', ()=>{ colorLocked = false; });
  startCamera();
})();
</script>
</body>
</html>
