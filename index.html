<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>My Digital Binder</title>
<style>
  :root{
    --paper:#F3F1EB;
    --card:#FFFFFF;
    --ink:#1E2124;
    --ink-soft:#6B6F76;
    --ink-faint:#9A9D9F;
    --line:#E4E0D4;
    --line-soft:#ECE9DF;
    --misc:#6B6B6B;
    --danger:#B23A2E;
    --danger-soft:#F3E2DF;
    --radius-pill:999px;
    --radius-card:20px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(30,33,36,.06), 0 10px 24px rgba(30,33,36,.07);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overscroll-behavior-y:none;
    -webkit-user-select:none;
    user-select:none;
  }
  input,textarea{-webkit-user-select:text; user-select:text;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.01em;}
  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-top:calc(var(--safe-top) + 14px);
    padding-bottom:calc(var(--safe-bottom) + 14px);
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:0 20px;
    animation:fadeIn .22s ease;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:40px;
    margin-bottom:18px;
  }
  .back-btn{
    width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--card);
    box-shadow:var(--shadow);
    font-size:21px;
    color:var(--ink);
    border:none;
    flex-shrink:0;
    transition:transform .1s ease;
  }
  .back-btn:active{transform:scale(.92);}
  .topbar-title{
    font-size:20px;
    font-weight:700;
    letter-spacing:-.01em;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tab-dot{
    width:11px; height:11px; border-radius:50%;
    flex-shrink:0;
  }

  /* ---------- home ---------- */
  .home{justify-content:center; gap:16px;}
  .home-header{text-align:center; margin-bottom:10px;}
  .home-title{font-size:28px; font-weight:800; letter-spacing:-.02em;}
  .home-sub{font-size:13px; color:var(--ink-faint); margin-top:7px;}
  .pill-primary{
    height:112px;
    border-radius:var(--radius-pill);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-size:23px;
    font-weight:750;
    letter-spacing:-.01em;
    border:none;
    box-shadow:var(--shadow);
    background:var(--ink);
    color:var(--paper);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .pill-primary.outline{
    background:var(--card);
    color:var(--ink);
    border:2px solid var(--ink);
  }
  .pill-primary:active{transform:scale(.96); box-shadow:0 1px 2px rgba(30,33,36,.08);}
  .pill-icon{font-size:25px; line-height:1;}
  .home-footer{
    display:flex; justify-content:center; gap:30px;
    margin-top:22px;
  }
  .text-btn{
    background:none; border:none;
    color:var(--ink-soft);
    font-size:15px; font-weight:600;
    padding:10px 6px;
  }
  .text-btn.danger{color:var(--danger);}

  /* ---------- class grid ---------- */
  .class-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .class-pill{
    background:var(--card);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow);
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    border:none;
    text-align:left;
    min-height:98px;
    transition:transform .1s ease;
  }
  .class-pill:active{transform:scale(.95);}
  .class-pill .tab-dot{width:16px; height:16px;}
  .class-pill-name{
    font-size:17px;
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.2;
  }
  .class-pill-meta{font-size:12.5px; color:var(--ink-faint);}
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.55;
    margin-top:40px;
    padding:0 10px;
  }

  /* ---------- forms ---------- */
  .field{margin-bottom:20px;}
  .field-label{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:9px;
    display:block;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=datetime-local]{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    padding:16px;
    font-size:16.5px;
    color:var(--ink);
    font-family:inherit;
    min-height:54px;
  }
  .field input:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border-radius:var(--radius-sm);
    padding:16px;
    border:1.5px solid var(--line);
    min-height:54px;
  }
  .switch-label{font-size:16px; font-weight:600;}
  .switch{
    width:54px; height:32px; border-radius:999px;
    background:var(--line);
    position:relative;
    border:none;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .switch.on{background:var(--ink);}
  .switch::after{
    content:"";
    position:absolute; top:3px; left:3px;
    width:26px; height:26px; border-radius:50%;
    background:#fff;
    transition:transform .16s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch.on::after{transform:translateX(22px);}
  .unit-extra{margin-top:12px; display:flex; flex-direction:column; gap:12px;}
  .type-chip-row{display:flex; gap:10px; margin-top:-6px; margin-bottom:20px;}
  .type-chip{
    flex:1;
    padding:14px 8px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--line);
    background:var(--card);
    font-weight:700;
    font-size:15px;
    color:var(--ink-soft);
    transition:transform .1s ease;
  }
  .type-chip.on{color:#fff;}
  .type-chip:active{transform:scale(.95);}
  .btn-block{
    width:100%;
    padding:19px;
    border-radius:var(--radius-pill);
    border:none;
    font-size:18px;
    font-weight:700;
    background:var(--ink);
    color:var(--paper);
    box-shadow:var(--shadow);
    margin-top:auto;
    min-height:58px;
    transition:transform .1s ease;
  }
  .btn-block:active{transform:scale(.97);}
  .btn-block:disabled{opacity:.4;}
  .btn-block.outline-btn{
    background:var(--card);
    color:var(--ink);
    border:2px solid var(--ink);
    box-shadow:none;
  }
  .form-spacer{flex:1;}
  .storage-card{
    background:var(--card);
    border-radius:var(--radius-sm);
    padding:16px;
    border:1.5px solid var(--line);
    margin-bottom:18px;
  }
  .storage-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:14.5px; font-weight:600;
  }
  .storage-bar{
    height:8px; border-radius:999px;
    background:var(--line-soft);
    margin-top:12px;
    overflow:hidden;
  }
  .storage-bar-fill{height:100%; background:var(--ink); border-radius:999px;}

  /* ---------- photos step ---------- */
  .hint{
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--card);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    margin-bottom:16px;
    line-height:1.45;
  }
  .photo-toolbar{
    display:flex; gap:10px;
    margin-bottom:18px;
  }
  .tool-btn{
    flex:1;
    padding:15px;
    border-radius:var(--radius-sm);
    border:2px solid var(--ink);
    background:var(--card);
    font-weight:700;
    font-size:15.5px;
    color:var(--ink);
    min-height:52px;
    transition:transform .1s ease;
  }
  .tool-btn:active{transform:scale(.96);}
  .tool-btn.active{background:var(--ink); color:var(--paper);}
  .tool-btn.remove-mode{border-color:var(--danger); color:var(--danger);}
  .tool-btn.remove-mode.active{background:var(--danger); color:#fff;}
  .thumb-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding-bottom:14px;
    overflow-y:auto;
  }
  .thumb{
    position:relative;
    aspect-ratio:3/4;
    border-radius:14px;
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
    touch-action:none;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
  .thumb-order{
    position:absolute; top:6px; left:6px;
    background:rgba(30,33,36,.72);
    color:#fff;
    font-size:11px; font-weight:700;
    padding:2px 7px;
    border-radius:999px;
  }
  .thumb-del-badge{
    position:absolute; inset:0;
    background:rgba(178,58,46,.28);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:26px; font-weight:800;
  }
  .thumb-hidden{opacity:.25;}
  .thumb.drop-target{outline:3px solid var(--ink); outline-offset:-3px;}
  .thumb-ghost{
    position:fixed;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 12px 28px rgba(0,0,0,.35);
    z-index:500;
    pointer-events:none;
    opacity:.95;
  }
  .thumb-add-tile{
    display:flex; align-items:center; justify-content:center;
    border:2px dashed var(--line);
    border-radius:14px;
    color:var(--ink-faint);
    font-size:30px;
    aspect-ratio:3/4;
    background:transparent;
  }

  /* ---------- review list ---------- */
  .search-input{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    font-size:16px;
    color:var(--ink);
    font-family:inherit;
    margin-bottom:14px;
    min-height:50px;
  }
  .search-input:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .topbar-actions{display:flex; gap:8px; flex-shrink:0;}
  .topbar-btn{
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    padding:9px 14px;
    border-radius:999px;
    box-shadow:var(--shadow);
    flex-shrink:0;
    transition:transform .1s ease;
  }
  .topbar-btn:active{transform:scale(.93);}
  .topbar-btn.star-on{border-color:#C79A44; background:#C79A44; color:#fff;}
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(10,10,11,.45);
    z-index:800;
    display:flex; align-items:flex-end;
    animation:fadeIn .18s ease;
  }
  .sort-sheet{
    width:100%;
    background:var(--paper);
    border-radius:26px 26px 0 0;
    padding:12px 20px calc(var(--safe-bottom) + 22px);
    box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet-handle{
    width:40px; height:5px; border-radius:999px;
    background:var(--line);
    margin:6px auto 14px;
  }
  .sheet-title{
    font-size:13px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .sort-option{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:15px 16px;
    font-size:16px; font-weight:600;
    color:var(--ink);
    margin-bottom:10px;
  }
  .sort-option.active{border-color:var(--ink); background:var(--ink); color:var(--paper);}
  .sort-check{font-weight:800;}
  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-chip{
    padding:10px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    transition:transform .1s ease;
  }
  .filter-chip:active{transform:scale(.94);}
  .filter-chip.on{color:#fff; border-color:var(--ink); background:var(--ink);}
  .filter-chip.star-chip{border-color:#C79A44; color:#C79A44;}
  .filter-chip.star-chip-on{background:#C79A44; border-color:#C79A44; color:#fff;}
  .paper-list{display:flex; flex-direction:column; gap:12px; overflow-y:auto;}
  .paper-card{
    display:flex; gap:14px;
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:12px;
    border:none;
    text-align:left;
    align-items:center;
    min-height:70px;
    transition:transform .1s ease;
  }
  .paper-card:active{transform:scale(.97);}
  .paper-thumb-wrap{position:relative; flex-shrink:0;}
  .paper-thumb{
    width:64px; height:82px;
    border-radius:11px;
    object-fit:cover;
    background:var(--line-soft);
    display:block;
  }
  .fav-flag{
    position:absolute; top:-6px; right:-6px;
    width:22px; height:22px;
    background:#C79A44; color:#fff;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
  }
  .paper-info{min-width:0; flex:1;}
  .paper-title{font-size:16.5px; font-weight:700; letter-spacing:-.01em; line-height:1.25;}
  .paper-meta-row{
    display:flex; align-items:center; gap:6px;
    margin-top:7px; flex-wrap:wrap;
  }
  .unit-badge,.kind-badge{
    font-size:11.5px; font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    color:#fff;
  }
  .paper-date{font-size:12px; color:var(--ink-faint);}

  /* ---------- paper detail ---------- */
  .detail-meta-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .detail-actions{margin-bottom:14px;}
  .page-view{
    display:flex; flex-direction:column; gap:16px;
    overflow-y:auto;
  }
  .page-card{
    background:var(--card);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .page-card img{width:100%; display:block;}
  .page-card-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
  }
  .page-num{font-size:12.5px; color:var(--ink-faint); font-weight:600;}
  .share-btn{
    border:none; background:var(--ink); color:var(--paper);
    font-size:13.5px; font-weight:700;
    padding:10px 18px; border-radius:999px;
    transition:transform .1s ease;
  }
  .share-btn:active{transform:scale(.93);}

  /* ---------- zoom overlay ---------- */
  .zoom-overlay{
    position:fixed; inset:0; background:rgba(10,10,11,.96);
    z-index:900;
    display:flex; align-items:center; justify-content:center;
  }
  .zoom-overlay img{max-width:100%; max-height:100%; object-fit:contain;}

  /* ---------- manage classes list ---------- */
  .manage-row{
    display:flex; align-items:center; gap:14px;
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:12px;
    min-height:36px;
  }
  .manage-row .tab-dot{width:16px; height:16px;}
  .manage-name{flex:1; font-size:16px; font-weight:700;}
  .manage-meta{font-size:12.5px; color:var(--ink-faint);}
  .manage-remove{
    border:none; background:var(--danger-soft); color:var(--danger);
    font-size:13.5px; font-weight:700;
    padding:10px 16px; border-radius:999px;
    transition:transform .1s ease;
  }
  .manage-remove:active{transform:scale(.93);}
  .add-class-row{display:flex; gap:10px; margin-bottom:22px;}
  .add-class-row input{
    flex:1;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius-sm);
    padding:16px;
    font-size:16.5px;
    color:var(--ink);
    font-family:inherit;
    min-height:54px;
  }
  .add-class-row button{
    border:none; background:var(--ink); color:var(--paper);
    font-weight:700; font-size:15.5px;
    padding:0 22px; border-radius:var(--radius-sm);
    min-height:54px;
    transition:transform .1s ease;
  }
  .add-class-row button:active{transform:scale(.95);}
  .cap-note{font-size:13px; color:var(--ink-faint); margin-bottom:18px;}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file-input" accept="image/*" multiple style="display:none">
<input type="file" id="backup-file-input" accept="application/json,.json" style="display:none">
<script>
/* ============================== constants ============================== */
const TAB_COLORS = ['#3E7A73','#B5563C','#C79A44','#7A4E6D','#3E5C8A','#7A8B4E','#C06B5C','#5C6B7A'];
const MISC = { id:'misc', name:'Misc', color:'#6B6B6B', builtin:true };
const MAX_CLASSES = 8;
const KIND_COLORS = { quiz:'#3E5C8A', test:'#C79A44', exam:'#B23A2E' };
const KIND_LABELS = { quiz:'Quiz', test:'Test', exam:'Exam' };
const SORT_OPTIONS = [
  {key:'unit-desc', label:'Unit: High to Low'},
  {key:'unit-asc', label:'Unit: Low to High'},
  {key:'date-desc', label:'Date: Newest First'},
  {key:'date-asc', label:'Date: Oldest First'},
  {key:'title-asc', label:'Title: A to Z'}
];
function sortPapers(list, sortKey){
  const arr = list.slice();
  arr.sort((a,b)=>{
    switch(sortKey){
      case 'unit-asc':{
        const ua=(a.unit==null?9999:a.unit), ub=(b.unit==null?9999:b.unit);
        return ua-ub;
      }
      case 'date-desc': return new Date(b.date)-new Date(a.date);
      case 'date-asc': return new Date(a.date)-new Date(b.date);
      case 'title-asc': return a.title.localeCompare(b.title);
      case 'unit-desc':
      default:{
        const ua=(a.unit==null?-1:a.unit), ub=(b.unit==null?-1:b.unit);
        if (ub!==ua) return ub-ua;
        return new Date(b.date)-new Date(a.date);
      }
    }
  });
  return arr;
}

function typeChip(kind, label, d){
  const on = d.kind===kind;
  return h('button',{
    class:'type-chip'+(on?' on':''),
    style: on ? `background:${KIND_COLORS[kind]}; border-color:${KIND_COLORS[kind]};` : '',
    onclick:()=>{ d.kind = on ? null : kind; render(); }
  }, label);
}
function kindBadge(kind){
  if (!kind) return null;
  return h('span',{class:'kind-badge', style:`background:${KIND_COLORS[kind]}`}, KIND_LABELS[kind]);
}

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

/* ============================== IndexedDB ============================== */
let dbPromise = new Promise((resolve, reject)=>{
  const req = indexedDB.open('digitalBinderDB', 1);
  req.onupgradeneeded = (e)=>{
    const db = e.target.result;
    if (!db.objectStoreNames.contains('classes')) db.createObjectStore('classes', {keyPath:'id'});
    if (!db.objectStoreNames.contains('papers')) db.createObjectStore('papers', {keyPath:'id'});
  };
  req.onsuccess = ()=>resolve(req.result);
  req.onerror = ()=>reject(req.error);
});

async function dbGetAll(store){
  const db = await dbPromise;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function dbPut(store, obj){
  const db = await dbPromise;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function dbDelete(store, id){
  const db = await dbPromise;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

/* ============================== state ============================== */
const state = {
  view:'home',
  classes:[],
  papers:[],
  mode:null,            // 'add' | 'review'
  selectedClassId:null,
  draftPaper:null,       // {title, date, unit, unitName, pages:[{id, blob}]}
  deleteMode:false,
  reviewList:[],
  reviewFilter:new Set(),
  reviewFavoritesOnly:false,
  reviewSearch:'',
  reviewSort:'unit-desc',
  sortSheetOpen:false,

  state.classes.sort((a,b)=>a.order-b.order);

  refreshStorageEstimate();
  goHome();

function formatBytes(bytes){
  if (bytes==null) return '—';
  if (bytes < 1024) return bytes + ' B';
  const units = ['KB','MB','GB','TB'];
  let val = bytes, i=-1;
  do { val/=1024; i++; } while (val>=1024 && i<units.length-1);
  return val.toFixed(val<10?1:0) + ' ' + units[i];
}

async function refreshStorageEstimate(){
  if (!(navigator.storage && navigator.storage.estimate)) return;
  try{
    const est = await navigator.storage.estimate();
    state.storageUsage = est.usage;
    state.storageQuota = est.quota;
    if (state.view==='home' || state.view==='backup') render();
  }catch(err){ /* not available, ignore */ }
}

function goHome(){
  revokeUrls();
  state.view='home';

  state.draftPaper=null;

/* ============================== image compression ============================== */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const maxDim = 1800;
      let {width,height} = img;
      if (width>maxDim || height>maxDim){
        if (width>=height){ height = Math.round(height*maxDim/width); width=maxDim; }
        else { width = Math.round(width*maxDim/height); height=maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,width,height);
      canvas.toBlob(blob=>{
        URL.revokeObjectURL(url);
        resolve(blob);
      },'image/jpeg',0.82);
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function h(tag, attrs={}, children=[]){
  const el = document.createElement(tag);
  for (const k in attrs){
    const v = attrs[k];
    if (v===undefined || v===null) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if (k==='style') el.style.cssText = v;
    else if (v===true) el.setAttribute(k, '');
    else if (v===false) continue;
    else el.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if (c==null) return;
    el.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return el;
}

function topbar(title, onBack, tabColor, rightEls){
  const bar = h('div',{class:'topbar'});
  if (onBack) bar.appendChild(h('button',{class:'back-btn', onclick:onBack}, '‹'));
  if (tabColor) bar.appendChild(h('span',{class:'tab-dot', style:`background:${tabColor}`}));
  bar.appendChild(h('div',{class:'topbar-title'}, title));
  if (rightEls){
    const arr = Array.isArray(rightEls) ? rightEls : [rightEls];
    const actions = h('div',{class:'topbar-actions'});
    arr.forEach(e=>actions.appendChild(e));
    bar.appendChild(actions);
  }
  return bar;
}

  }
  render();
});

function attachDragHandlers(container){
  let sourceIndex=null, targetIndex=null, dragging=false, dragEl=null, ghost=null, startX=0, startY=0;

  container.querySelectorAll('.thumb').forEach(el=>{
    el.addEventListener('pointerdown', e=>{
      if (state.deleteMode){
        const idx = Number(el.dataset.index);
        deletePage(idx);
        return;
      }
      sourceIndex = Number(el.dataset.index);
      dragEl = el; dragging=false;
      startX=e.clientX; startY=e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });

    el.addEventListener('pointermove', e=>{
      if (sourceIndex===null || state.deleteMode) return;
      const dx=e.clientX-startX, dy=e.clientY-startY;
      if (!dragging && Math.hypot(dx,dy)>8){
        dragging = true;
        const rect = dragEl.getBoundingClientRect();
        ghost = dragEl.cloneNode(true);
        ghost.className = 'thumb thumb-ghost';
        ghost.style.width = rect.width+'px';
        ghost.style.height = rect.height+'px';
        ghost.style.left = rect.left+'px';
        ghost.style.top = rect.top+'px';
        document.body.appendChild(ghost);
        dragEl.classList.add('thumb-hidden');
      }
      if (dragging){
        ghost.style.left = (e.clientX - ghost.offsetWidth/2)+'px';
        ghost.style.top = (e.clientY - ghost.offsetHeight/2)+'px';
        const atPoint = document.elementFromPoint(e.clientX, e.clientY);
        const hover = atPoint && atPoint.closest('.thumb:not(.thumb-ghost)');
        container.querySelectorAll('.thumb').forEach(t=>t.classList.remove('drop-target'));
        if (hover && hover!==dragEl){
          hover.classList.add('drop-target');
          targetIndex = Number(hover.dataset.index);
        } else {
          targetIndex = null;
        }
      }
    });

    el.addEventListener('pointerup', ()=>{
      if (dragging){
        if (ghost){ ghost.remove(); ghost=null; }
        dragEl.classList.remove('thumb-hidden');
        container.querySelectorAll('.thumb').forEach(t=>t.classList.remove('drop-target'));
        if (targetIndex!==null && targetIndex!==sourceIndex){
          const pages = state.draftPaper.pages;
          const [moved] = pages.splice(sourceIndex,1);
          pages.splice(targetIndex,0,moved);
          render();
        }
      } else if (sourceIndex!==null && !state.deleteMode){
        openZoom(state.draftPaper.pages[sourceIndex].blob);
      }
      sourceIndex=null; targetIndex=null; dragging=false; dragEl=null;
    });

    el.addEventListener('pointercancel', ()=>{
      if (ghost){ ghost.remove(); ghost=null; }
      if (dragEl) dragEl.classList.remove('thumb-hidden');
      sourceIndex=null; targetIndex=null; dragging=false; dragEl=null;
    });
  });
}

function deletePage(idx){

    unitName: d.unit ? (d.unitName.trim() || null) : null,
    kind: d.kindOn ? d.kind : null,
    favorite: false,
    pages: d.pages
  };
  await dbPut('papers', paper);
  state.papers.push(paper);
  refreshStorageEstimate();
  goHome();
}

    screen.appendChild(h('div',{class:'empty-note'}, `No papers saved for ${cls.name} yet.`));

    oninput:e=>{ state.reviewSearch = e.target.value; render(); }
  }));

  return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}

function openPaperDetail(paper){
  state.reviewPaper = paper;
  state.view = 'paperDetail';
  render();
}

/* ============================== PAPER DETAIL ============================== */
function renderPaperDetail(){
  const cls = classById(state.selectedClassId);
  const p = state.reviewPaper;
  const screen = h('div',{class:'screen'});
  screen.appendChild(topbar(p.title, ()=>{state.view='reviewList'; render();}, cls.color, [
    h('button',{class:'topbar-btn'+(p.favorite?' star-on':''), onclick:()=>toggleFavorite(p)}, p.favorite?'★':'☆'),
    h('button',{class:'topbar-btn', onclick:()=>openEditPaper(p)}, '✎ Edit')
  ]));

  const metaRow = h('div',{class:'detail-meta-row'});
  const badge = kindBadge(p.kind);
  if (badge) metaRow.appendChild(badge);
  metaRow.appendChild(h('span',{class:'hint', style:'margin:0; flex:1;'}, [
    p.unit!=null ? `Unit ${p.unit}${p.unitName? ' · '+p.unitName : ''} · ` : '',
    formatDate(p.date), ` · ${p.pages.length} page${p.pages.length===1?'':'s'}`
  ].join('')));
  screen.appendChild(metaRow);

  screen.appendChild(h('div',{class:'detail-actions'},[
    h('button',{class:'btn-block', style:'margin-top:0;', onclick:()=>shareAllPages(p)}, 'Share All Pages')
  ]));

  const pageView = h('div',{class:'page-view'});
  p.pages.forEach((page, idx)=>{
    pageView.appendChild(h('div',{class:'page-card'},[
      h('img',{src:urlFor(page.blob), onclick:()=>openZoom(page.blob)}),
      h('div',{class:'page-card-footer'},[
        h('span',{class:'page-num mono'}, `Page ${idx+1} of ${p.pages.length}`),
        h('button',{class:'share-btn', onclick:()=>sharePage(page.blob, `${p.title}-p${idx+1}.jpg`)}, 'Save')
      ])
    ]));
  });
  screen.appendChild(pageView);
  return screen;
}

async function sharePage(blob, filename){
  try{
    const file = new File([blob], filename, {type:'image/jpeg'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      return;
    }
  }catch(err){
    if (err.name==='AbortError') return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

async function shareAllPages(paper){
  try{
    const files = paper.pages.map((pg,i)=> new File([pg.blob], `${paper.title}-p${i+1}.jpg`, {type:'image/jpeg'}));
    if (navigator.canShare && navigator.canShare({files})){
      await navigator.share({files});
      return;
    }
  }catch(err){
    if (err.name==='AbortError') return;
  }
  alert("Your browser can't share multiple images at once — use the Save button under each page instead.");
}

/* ============================== BACKUP ============================== */
function renderBackup(){
  const screen = h('div',{class:'screen'});
  screen.appendChild(topbar('Backup Data', goHome));

  screen.appendChild(h('div',{class:'hint'}, 'Your papers live only on this device. Export a backup file now and then — especially before switching phones — and keep it somewhere safe like iCloud Drive or Files.'));

  if (state.storageUsage!=null){
    const pct = state.storageQuota ? Math.min(100, (state.storageUsage/state.storageQuota*100)) : null;
    screen.appendChild(h('div',{class:'storage-card'},[
      h('div',{class:'storage-row'},[
        h('span',{},'Storage used'),
        h('span',{class:'mono'}, formatBytes(state.storageUsage) + (state.storageQuota? ' of '+formatBytes(state.storageQuota) : ''))
      ]),
      pct!=null ? h('div',{class:'storage-bar'},[
        h('div',{class:'storage-bar-fill', style:`width:${pct}%;`})
      ]) : null
    ]));
  }

  screen.appendChild(h('button',{class:'btn-block', style:'margin-top:8px;', disabled: state.backupBusy?true:undefined, onclick:exportBackup},
    state.backupBusy && state.backupBusyLabel==='export' ? 'Preparing backup…' : 'Export Backup'));
  screen.appendChild(h('button',{class:'btn-block outline-btn', style:'margin-top:12px;', disabled: state.backupBusy?true:undefined, onclick:()=>document.getElementById('backup-file-input').click()},
    state.backupBusy && state.backupBusyLabel==='import' ? 'Importing…' : 'Import Backup'));
  screen.appendChild(h('div',{class:'form-spacer'}));
  return screen;
}

function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataUrl){
  return fetch(dataUrl).then(r=>r.blob());
}

async function exportBackup(){
  state.backupBusy = true; state.backupBusyLabel='export'; render();
  try{
    const papersOut = [];
    for (const p of state.papers){
      const pages = [];
      for (const pg of p.pages){
        pages.push({id:pg.id, dataUrl: await blobToDataURL(pg.blob)});
      }
      papersOut.push({...p, pages});
    }
    const payload = {version:1, exportedAt:new Date().toISOString(), classes:state.classes, papers:papersOut};
    const json = JSON.stringify(payload);
    const blob = new Blob([json], {type:'application/json'});
    const filename = `digital-binder-backup-${new Date().toISOString().slice(0,10)}.json`;
    let shared = false;
    try{
      const file = new File([blob], filename, {type:'application/json'});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        shared = true;
      }
    }catch(err){ if (err.name==='AbortError'){ shared = true; } }
    if (!shared){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
    }
  }catch(err){
    console.error(err);
    alert('Something went wrong preparing the backup.');
  }
  state.backupBusy = false; state.backupBusyLabel='';
  refreshStorageEstimate();
  render();
}

async function importBackup(file){
  if (!confirm('Import this backup? Matching classes and papers will be added or overwritten.')) return;
  state.backupBusy = true; state.backupBusyLabel='import'; render();
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if (!payload || !Array.isArray(payload.classes) || !Array.isArray(payload.papers)) throw new Error('bad format');
    for (const c of payload.classes) await dbPut('classes', c);
    for (const p of payload.papers){
      const pages = [];
      for (const pg of p.pages) pages.push({id:pg.id, blob: await dataURLToBlob(pg.dataUrl)});
      await dbPut('papers', {...p, pages, favorite: !!p.favorite});
    }
    state.classes = await dbGetAll('classes');
    state.classes.sort((a,b)=>a.order-b.order);
    state.papers = await dbGetAll('papers');
    state.backupBusy = false; state.backupBusyLabel='';
    refreshStorageEstimate();
    render();
    alert('Backup imported.');
  }catch(err){
    console.error(err);
    state.backupBusy = false; state.backupBusyLabel='';
    render();
    alert("Couldn't import that file — make sure it's a Digital Binder backup.");
  }
}

document.getElementById('backup-file-input').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (file) importBackup(file);
});

/* ============================== MANAGE CLASSES ============================== */
function renderManage(){
  const screen = h('div',{class:'screen'});
  screen.appendChild(topbar(state.manageTab==='add' ? 'Add Class' : 'Remove Class', goHome));

  if (state.manageTab==='add'){
    const atCap = state.classes.length >= MAX_CLASSES;
    screen.appendChild(h('div',{class:'cap-note'}, atCap
      ? `You've reached ${MAX_CLASSES} classes. Remove one to add another — Misc is always available too.`
      : `${state.classes.length} of ${MAX_CLASSES} classes used.`));
    let inputVal = '';
    const input = h('input',{type:'text', placeholder:'Class name, e.g. Biology', oninput:e=>inputVal=e.target.value});
    const row = h('div',{class:'add-class-row'},[
      input,
      h('button',{onclick: async ()=>{
        const name = inputVal.trim();
        if (!name || atCap) return;
        const cls = {id:uid(), name, color:nextColor(), order:state.classes.length};
        await dbPut('classes', cls);
        state.classes.push(cls);
        render();
      }}, 'Add')
    ]);
    if (!atCap) screen.appendChild(row);
    state.classes.forEach(c=>{
      screen.appendChild(h('div',{class:'manage-row'},[
        h('span',{class:'tab-dot', style:`background:${c.color}`}),
        h('span',{class:'manage-name'}, c.name)
      ]));
    });
    if (!state.classes.length) screen.appendChild(h('div',{class:'empty-note'},'No classes yet — add your first one above.'));
  } else {
    if (!state.classes.length){
      screen.appendChild(h('div',{class:'empty-note'},'No classes to remove yet.'));
      return screen;
    }
    state.classes.forEach(c=>{
      const count = state.papers.filter(p=>p.classId===c.id).length;
      screen.appendChild(h('div',{class:'manage-row'},[
        h('span',{class:'tab-dot', style:`background:${c.color}`}),
        h('div',{style:'flex:1;'},[
          h('div',{class:'manage-name'}, c.name),
          h('div',{class:'manage-meta mono'}, `${count} paper${count===1?'':'s'}`)
        ]),
        h('button',{class:'manage-remove', onclick:()=>removeClass(c, count)}, 'Remove')
      ]));
    });
  }
  return screen;
}

async function removeClass(cls, count){
  const msg = count>0
    ? `Remove "${cls.name}"? Its ${count} paper${count===1?'':'s'} will move to Misc.`
    : `Remove "${cls.name}"?`;
  if (!confirm(msg)) return;
  await dbDelete('classes', cls.id);
  state.classes = state.classes.filter(c=>c.id!==cls.id);
  const affected = state.papers.filter(p=>p.classId===cls.id);
  for (const p of affected){
    p.classId = 'misc';
    await dbPut('papers', p);
  }
  render();
}

boot();
</script>
